services:
  - type: web
    name: findhouse-laravel
    env: php
    branch: main            # đổi thành nhánh bạn muốn deploy (main/master)
    buildCommand: |
      # cài PHP packages (production)
      composer install --no-dev --optimize-autoloader --no-interaction
      # cài node packages & build Vite assets
      npm ci
      npm run build
      # tạo symlink storage nếu cần
      php artisan storage:link || true
      # cache config/routes/views để tăng tốc
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: php artisan serve --host 0.0.0.0 --port 10000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
